{% extends "base.html" %}
{% block title %} | Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-7">
    <div class="auth-card">
      <h2 class="fw-bold mb-2">Iniciar sesión</h2>
      <p class="text-muted mb-4">Accede a tu panel de consultas y movimientos.</p>
      <form method="post" class="row g-3">
        <div class="col-12">
          <label class="form-label">Correo</label>
          <input type="email" name="email" class="form-control form-control-lg" required>
        </div>
        <div class="col-12">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>
        <div class="col-12 d-grid">
          <button class="btn btn-primary btn-lg">Ingresar</button>
        </div>
      </form>
      <p class="mt-4 mb-0 text-muted">¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
    </div>
  </div>
</div>
{% endblock %}
